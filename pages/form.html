    <main>
        <section class="frm-hero hro">
            <div class="inner-hero">
                <h1>Contact Us</h1>
                <p>Feel free to contact us if you may for more inquiries.</p>
            </div>
        </section>
        <section class="form">
            <div class="header">
                <h2>Contact Us</h2>
                <p>contact us via this form</p>
                
            </div>
            <div class="form">
                    <form>
                        <div class="FormItems">
                            <label>Name</label>
                            <input name="name" type="text" placeholder="Type your name">
                        </div>
                        <div class="FormItems">
                            <label>Email</label>
                            <input name="email" type="email" placeholder="abcd11@gmail.com">
                        </div>
                        <div class="FormItems">
                            <label>Reason For Contact</label>
                            <select name="ReasonForContact" placeholder="Reason">
                                <option></option>
                                <option value="Unofficial">Unofficial</option>
                                <option value="Official">Official</option>
                            </select>
                        </div>
                        <div class="FormItems">
                            <label>Gender</label>
                            <span>
                                <input id="male" name="gender" type="radio"> <label for="male">Male</label>
                            </span>
                            <span>
                                <input id="female" name="gender" type="radio"> <label for="female">Female</label>
                            </span>
                            
                        </div>
                        <button>
                            Submit
                        </button>
                    </form>
                </div>
        </section>
